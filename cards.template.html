<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Metafight</title>
    <link href="css/style.css" rel="stylesheet"/>
</head>

<style>
    ul {
        display: grid;
        gap: 1px;
        justify-content: center;
        padding: 1px;
        background: hsl(from papayawhip h s 50);
        width: 100%;
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    }

    li {
        perspective: 1000px;
        transition: transform 0.25s ease;
        box-sizing: border-box;

        & img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            border: 2px solid hsl(from coral h s 75);
            /*position: relative;*/

            /*&::after {*/
            /*    content: "";*/
            /*    position: absolute;*/
            /*    inset: 0;*/

            /*    background-repeat: no-repeat;*/
            /*    background-position: -100% 0, 0 0;*/

            /*    background-image: linear-gradient(*/
            /*            45deg,*/
            /*            transparent 20%,*/
            /*            transparent 40%,*/
            /*            !*rgb(68, 68, 68, 0.2) 50%,*!*/
            /*            !*rgb(68, 68, 68, 0.2) 55%,*!*/
            /*            black 50%,*/
            /*            black 55%,*/
            /*            transparent 70%,*/
            /*            transparent 100%*/
            /*    );*/

            /*    background-size: 250% 250%, 100% 100%;*/
            /*    transition: background-position 0s ease;*/

            /*    &:hover {*/
            /*        background-position: 100% 0;*/
            /*    }*/
            /*}*/
        }

        &:hover {
            transform: scale(1.1);
            z-index: 10;
        }
    }
</style>

<body>
<main style="background-color: papayawhip;">
    __TEMPLATE__
</main>

<script>
    const lis = document.querySelectorAll("li");
    lis.forEach((li) => {
        const img = li.querySelector("img");

        li.addEventListener("mousemove", (e) => {
            const rect = li.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const xCenter = rect.width / 2;
            const yCenter = rect.height / 2;

            const xRotate = (yCenter - y) / 7;
            const yRotate = (x - xCenter) / 7;

            img.style.transform = `rotateX(${xRotate}deg) rotateY(${yRotate}deg)`;
        });

        li.addEventListener("mouseleave", () => {
            img.style.transform = `rotateX(0) rotateY(0)`;
        });
    })
</script>

</body>
</html>
