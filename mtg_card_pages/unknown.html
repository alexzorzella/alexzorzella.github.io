<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Custom MtG</title>
    <link href="/css/style.css" rel="stylesheet"/>
    <link href="/public/favicon.ico" rel="icon"/>
</head>

<style>
    ul {
        display: grid;
        gap: 1px;
        justify-content: center;
        padding: 1px;
        background: hsl(from papayawhip h s 50);
        width: 100%;
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    }

    li {
        perspective: 1000px;
        box-sizing: border-box;
        transition: transform 0.25s ease;

        & a {
            display: block;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        & img {
            border: 2px solid hsl(from coral h s 75);
            border-radius: 8px;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease-out;
        }

        &:hover {
            transform: scale(1.1);
            z-index: 10;
        }
    }
</style>

<body>
<main style="background-color: papayawhip;">
    <ul>
<li data-search="heist_the_louvre"><a href="/public/mtg/unknown/heist_the_louvre.png"><img src="/public/mtg/thumbnails/heist_the_louvre.webp" alt="heist_the_louvre"></a></li>
<li data-search="lady_liberty_reforged"><a href="/public/mtg/unknown/lady_liberty_reforged.png"><img src="/public/mtg/thumbnails/lady_liberty_reforged.webp" alt="lady_liberty_reforged"></a></li>
<li data-search="five_guys"><a href="/public/mtg/unknown/five_guys.png"><img src="/public/mtg/thumbnails/five_guys.webp" alt="five_guys"></a></li>
<li data-search="sleeper_monument"><a href="/public/mtg/unknown/sleeper_monument.png"><img src="/public/mtg/thumbnails/sleeper_monument.webp" alt="sleeper_monument"></a></li>
<li data-search="go_to_ihop"><a href="/public/mtg/unknown/go_to_ihop.png"><img src="/public/mtg/thumbnails/go_to_ihop.webp" alt="go_to_ihop"></a></li>
<li data-search="build_a_blockade"><a href="/public/mtg/unknown/build_a_blockade.png"><img src="/public/mtg/thumbnails/build_a_blockade.webp" alt="build_a_blockade"></a></li>
<li data-search="break_into_a_windows_users_house"><a href="/public/mtg/unknown/break_into_a_windows_users_house.png"><img src="/public/mtg/thumbnails/break_into_a_windows_users_house.webp" alt="break_into_a_windows_users_house"></a></li>
<li data-search="prius_vehicle"><a href="/public/mtg/unknown/prius_vehicle.png"><img src="/public/mtg/thumbnails/prius_vehicle.webp" alt="prius_vehicle"></a></li>
</ul>

</main>

<script>
    const lis = document.querySelectorAll("li");
    lis.forEach((li) => {
        const img = li.querySelector("img");

        li.addEventListener("mousemove", (e) => {
            const rect = img.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const xCenter = rect.width / 2;
            const yCenter = rect.height / 2;

            const xRotate = (yCenter - y) / 7;
            const yRotate = (x - xCenter) / 7;

            img.style.transform = `rotateX(${xRotate}deg) rotateY(${yRotate}deg)`;
        });

        li.addEventListener("mouseleave", () => {
            img.style.transform = `rotateX(0) rotateY(0)`;
        });
    })
</script>

</body>
</html>
