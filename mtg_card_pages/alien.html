<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Custom MtG</title>
    <link href="/css/style.css" rel="stylesheet"/>
    <link href="/public/favicon.ico" rel="icon"/>
</head>

<style>
    ul {
        display: grid;
        gap: 1px;
        justify-content: center;
        padding: 1px;
        background: hsl(from papayawhip h s 50);
        width: 100%;
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    }

    li {
        perspective: 1000px;
        box-sizing: border-box;
        transition: transform 0.25s ease;

        & a {
            display: block;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;

            transition: transform 0.6s;
        }

        & img {
            border: 2px solid hsl(from coral h s 75);
            border-radius: 8px;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease-out;
        }

        &:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        .flip__card-front {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            backface-visibility: hidden;
        }

        .flip__card-back {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            backface-visibility: hidden;
            transform: rotateY(180deg);
        }
    }
</style>

<body>
<main style="background-color: papayawhip;">
    <ul>
<li data-search="bishop_artificial_person_back_still_operational" data-card-type="double_faced" ><a href="/public/mtg/alien/bishop_artificial_person.png" ><img src="/public/mtg/thumbnails/bishop_artificial_person.webp" alt="bishop_artificial_person_back_still_operational" class="flip__card-front" >
<img src="/public/mtg/thumbnails/bishop_artificial_person_back_still_operational.webp" alt="bishop_artificial_person_back_still_operational" class="flip__card-back" >
<li data-search="face_hugger_back_parasitic_attachment" data-card-type="double_faced" ><a href="/public/mtg/alien/face_hugger.png" ><img src="/public/mtg/thumbnails/face_hugger.webp" alt="face_hugger_back_parasitic_attachment" class="flip__card-front" >
<img src="/public/mtg/thumbnails/face_hugger_back_parasitic_attachment.webp" alt="face_hugger_back_parasitic_attachment" class="flip__card-back" >
<li data-search="lieutenant_ellen_ripley" ><a href="/public/mtg/alien/lieutenant_ellen_ripley.png" ><img src="/public/mtg/thumbnails/lieutenant_ellen_ripley.webp" alt="lieutenant_ellen_ripley" >
<li data-search="newt_fearless_survivor" ><a href="/public/mtg/alien/newt_fearless_survivor.png" ><img src="/public/mtg/thumbnails/newt_fearless_survivor.webp" alt="newt_fearless_survivor" >
<li data-search="power_loader" ><a href="/public/mtg/alien/power_loader.png" ><img src="/public/mtg/thumbnails/power_loader.webp" alt="power_loader" >
<li data-search="the_xenomorph" ><a href="/public/mtg/alien/the_xenomorph.png" ><img src="/public/mtg/thumbnails/the_xenomorph.webp" alt="the_xenomorph" >
<li data-search="uscss_nostromo" ><a href="/public/mtg/alien/uscss_nostromo.png" ><img src="/public/mtg/thumbnails/uscss_nostromo.webp" alt="uscss_nostromo" >
</ul>

</main>

<script>
    const lis = document.querySelectorAll("li:not([data-card-type])");
    lis.forEach((li) => {
        const images = li.querySelectorAll("img");
        const img = images[images.length - 1];

        li.addEventListener("mousemove", (e) => {
            const rect = img.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const xCenter = rect.width / 2;
            const yCenter = rect.height / 2;

            const xRotate = (yCenter - y) / 7;
            const yRotate = (x - xCenter) / 7;

            img.style.transform = `rotateX(${xRotate}deg) rotateY(${yRotate}deg)`;
        });

        li.addEventListener("mouseleave", () => {
            img.style.transform = `rotateX(0) rotateY(0)`;
        });
    })

    const cardsWithBackside = document.querySelectorAll(`[data-card-type="double_faced"]`)

    cardsWithBackside.forEach((card) => {
        const anchor = card.querySelector("a")

            card.addEventListener("mouseover", (e) => {
                anchor.style.transform="rotateY(180deg)"
            })

            card.addEventListener("mouseout", (e) => {
                anchor.style.transform="rotateY(0deg)"
            })
    })
</script>
</body>
</html>
