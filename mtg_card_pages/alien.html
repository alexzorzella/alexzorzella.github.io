<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Custom MtG</title>
    <link href="/css/style.css" rel="stylesheet"/>
    <link href="/public/favicon.ico" rel="icon"/>
</head>

<style>
    ul {
        display: grid;
        gap: 1px;
        justify-content: center;
        padding: 1px;
        background: hsl(from papayawhip h s 50);
        width: 100%;
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    }

    li {
        perspective: 1000px;
        box-sizing: border-box;
        transition: transform 0.25s ease;

        & a {
            display: block;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        & img {
            border: 2px solid hsl(from coral h s 75);
            border-radius: 8px;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease-out;
        }

        &:hover {
            transform: scale(1.1);
            z-index: 10;
        }
    }
</style>

<body>
<main style="background-color: papayawhip;">
    <ul>
<li data-search="bishop_artificial_person_back_still_operational"><a href="/public/mtg/alien/bishop_artificial_person_back_still_operational.png"><img src="/public/mtg/thumbnails/bishop_artificial_person_back_still_operational.webp" alt="bishop_artificial_person_back_still_operational"></a></li>
<li data-search="the_xenomorph"><a href="/public/mtg/alien/the_xenomorph.png"><img src="/public/mtg/thumbnails/the_xenomorph.webp" alt="the_xenomorph"></a></li>
<li data-search="face_hugger"><a href="/public/mtg/alien/face_hugger.png"><img src="/public/mtg/thumbnails/face_hugger.webp" alt="face_hugger"></a></li>
<li data-search="lieutenant_ellen_ripley"><a href="/public/mtg/alien/lieutenant_ellen_ripley.png"><img src="/public/mtg/thumbnails/lieutenant_ellen_ripley.webp" alt="lieutenant_ellen_ripley"></a></li>
<li data-search="face_hugger_back_parasitic_attachment"><a href="/public/mtg/alien/face_hugger_back_parasitic_attachment.png"><img src="/public/mtg/thumbnails/face_hugger_back_parasitic_attachment.webp" alt="face_hugger_back_parasitic_attachment"></a></li>
<li data-search="uscss_nostromo"><a href="/public/mtg/alien/uscss_nostromo.png"><img src="/public/mtg/thumbnails/uscss_nostromo.webp" alt="uscss_nostromo"></a></li>
<li data-search="newt_fearless_survivor"><a href="/public/mtg/alien/newt_fearless_survivor.png"><img src="/public/mtg/thumbnails/newt_fearless_survivor.webp" alt="newt_fearless_survivor"></a></li>
<li data-search="bishop_artificial_person"><a href="/public/mtg/alien/bishop_artificial_person.png"><img src="/public/mtg/thumbnails/bishop_artificial_person.webp" alt="bishop_artificial_person"></a></li>
<li data-search="power_loader"><a href="/public/mtg/alien/power_loader.png"><img src="/public/mtg/thumbnails/power_loader.webp" alt="power_loader"></a></li>
</ul>

</main>

<script>
    const lis = document.querySelectorAll("li");
    lis.forEach((li) => {
        const img = li.querySelector("img");

        li.addEventListener("mousemove", (e) => {
            const rect = img.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const xCenter = rect.width / 2;
            const yCenter = rect.height / 2;

            const xRotate = (yCenter - y) / 7;
            const yRotate = (x - xCenter) / 7;

            img.style.transform = `rotateX(${xRotate}deg) rotateY(${yRotate}deg)`;
        });

        li.addEventListener("mouseleave", () => {
            img.style.transform = `rotateX(0) rotateY(0)`;
        });
    })
</script>

</body>
</html>
