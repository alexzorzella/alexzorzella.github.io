<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Custom MtG</title>
    <link href="/css/style.css" rel="stylesheet"/>
    <link href="/public/favicon.ico" rel="icon"/>
</head>

<style>
    ul {
        display: grid;
        gap: 1px;
        justify-content: center;
        padding: 1px;
        background: hsl(from papayawhip h s 50);
        width: 100%;
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    }

    li {
        perspective: 1000px;
        box-sizing: border-box;
        transition: transform 0.25s ease;

        & a {
            display: block;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        & img {
            border: 2px solid hsl(from coral h s 75);
            border-radius: 8px;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease-out;
        }

        &:hover {
            transform: scale(1.1);
            z-index: 10;
        }
    }
</style>

<body>
<main style="background-color: papayawhip;">
    <ul>
<li data-search="mariah_faithful"><a href="/public/mtg/notshown/mariah_faithful.png"><img src="/public/mtg/thumbnails/mariah_faithful.webp" alt="mariah_faithful"></a></li>
<li data-search="atmosphere_skimmer"><a href="/public/mtg/notshown/atmosphere_skimmer.png"><img src="/public/mtg/thumbnails/atmosphere_skimmer.webp" alt="atmosphere_skimmer"></a></li>
<li data-search="leslie_deputy_director"><a href="/public/mtg/notshown/leslie_deputy_director.png"><img src="/public/mtg/thumbnails/leslie_deputy_director.webp" alt="leslie_deputy_director"></a></li>
<li data-search="tempt_the_merchants"><a href="/public/mtg/notshown/tempt_the_merchants.png"><img src="/public/mtg/thumbnails/tempt_the_merchants.webp" alt="tempt_the_merchants"></a></li>
<li data-search="the_liaison"><a href="/public/mtg/notshown/the_liaison.png"><img src="/public/mtg/thumbnails/the_liaison.webp" alt="the_liaison"></a></li>
<li data-search="bill_and_ted"><a href="/public/mtg/notshown/bill_and_ted.png"><img src="/public/mtg/thumbnails/bill_and_ted.webp" alt="bill_and_ted"></a></li>
<li data-search="subsidize_squirrels"><a href="/public/mtg/notshown/subsidize_squirrels.png"><img src="/public/mtg/thumbnails/subsidize_squirrels.webp" alt="subsidize_squirrels"></a></li>
</ul>

</main>

<script>
    const lis = document.querySelectorAll("li");
    lis.forEach((li) => {
        const img = li.querySelector("img");

        li.addEventListener("mousemove", (e) => {
            const rect = img.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const xCenter = rect.width / 2;
            const yCenter = rect.height / 2;

            const xRotate = (yCenter - y) / 7;
            const yRotate = (x - xCenter) / 7;

            img.style.transform = `rotateX(${xRotate}deg) rotateY(${yRotate}deg)`;
        });

        li.addEventListener("mouseleave", () => {
            img.style.transform = `rotateX(0) rotateY(0)`;
        });
    })
</script>

</body>
</html>
