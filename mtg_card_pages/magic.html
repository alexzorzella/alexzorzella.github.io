<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Custom MtG</title>
    <link href="/css/style.css" rel="stylesheet"/>
    <link href="/public/favicon.ico" rel="icon"/>
</head>

<style>
    ul {
        display: grid;
        gap: 1px;
        justify-content: center;
        padding: 1px;
        background: hsl(from papayawhip h s 50);
        width: 100%;
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    }

    li {
        perspective: 1000px;
        box-sizing: border-box;
        transition: transform 0.25s ease;

        & a {
            display: block;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        & img {
            border: 2px solid hsl(from coral h s 75);
            border-radius: 8px;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease-out;
        }

        &:hover {
            transform: scale(1.1);
            z-index: 10;
        }
    }
</style>

<body>
<main style="background-color: papayawhip;">
    <ul>
<li><a href="/public/mtg/magic/apoapsis_crawler.png"><img src="/public/mtg/thumbnails/apoapsis_crawler.webp" alt="apoapsis_crawler"></a></li>
<li><a href="/public/mtg/magic/artificial_vendetta.png"><img src="/public/mtg/thumbnails/artificial_vendetta.webp" alt="artificial_vendetta"></a></li>
<li><a href="/public/mtg/magic/beast_seeker.png"><img src="/public/mtg/thumbnails/beast_seeker.webp" alt="beast_seeker"></a></li>
<li><a href="/public/mtg/magic/bountiful_season.png"><img src="/public/mtg/thumbnails/bountiful_season.webp" alt="bountiful_season"></a></li>
<li><a href="/public/mtg/magic/chain_of_waves.png"><img src="/public/mtg/thumbnails/chain_of_waves.webp" alt="chain_of_waves"></a></li>
<li><a href="/public/mtg/magic/gather_in_the_public_square.png"><img src="/public/mtg/thumbnails/gather_in_the_public_square.webp" alt="gather_in_the_public_square"></a></li>
<li><a href="/public/mtg/magic/hay_hauler.png"><img src="/public/mtg/thumbnails/hay_hauler.webp" alt="hay_hauler"></a></li>
<li><a href="/public/mtg/magic/high_sea_mutineers.png"><img src="/public/mtg/thumbnails/high_sea_mutineers.webp" alt="high_sea_mutineers"></a></li>
<li><a href="/public/mtg/magic/recall_obelisk.png"><img src="/public/mtg/thumbnails/recall_obelisk.webp" alt="recall_obelisk"></a></li>
<li><a href="/public/mtg/magic/sleeper_monument.png"><img src="/public/mtg/thumbnails/sleeper_monument.webp" alt="sleeper_monument"></a></li>
<li><a href="/public/mtg/magic/tempt_the_merchants.png"><img src="/public/mtg/thumbnails/tempt_the_merchants.webp" alt="tempt_the_merchants"></a></li>
<!--<li><a href="/public/mtg/magic/the_liaison.png"><img src="/public/mtg/thumbnails/the_liaison.webp" alt="the_liaison"></a></li>-->
</ul>

</main>

<script>
    const lis = document.querySelectorAll("li");
    lis.forEach((li) => {
        const img = li.querySelector("img");

        li.addEventListener("mousemove", (e) => {
            const rect = img.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const xCenter = rect.width / 2;
            const yCenter = rect.height / 2;

            const xRotate = (yCenter - y) / 7;
            const yRotate = (x - xCenter) / 7;

            img.style.transform = `rotateX(${xRotate}deg) rotateY(${yRotate}deg)`;
        });

        li.addEventListener("mouseleave", () => {
            img.style.transform = `rotateX(0) rotateY(0)`;
        });
    })
</script>

</body>
</html>
