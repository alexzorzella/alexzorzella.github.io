<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Custom MtG</title>
    <link href="/css/style.css" rel="stylesheet"/>
    <link href="/public/favicon.ico" rel="icon"/>
</head>

<style>
    ul {
        display: grid;
        gap: 1px;
        justify-content: center;
        padding: 1px;
        background: hsl(from papayawhip h s 50);
        width: 100%;
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    }

    li {
        perspective: 1000px;
        box-sizing: border-box;
        transition: transform 0.25s ease;

        & a {
            display: block;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;

            transition: transform 0.6s;
        }

        & img {
            border: 2px solid hsl(from coral h s 75);
            border-radius: 8px;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease-out;
        }

        &:hover {
            transform: scale(1.1);
            z-index: 10;
        }
    }
</style>

<body>
<main style="background-color: papayawhip;">
    <ul>
<li data-search="cosmonaut_zenith" title="" ><a href="/dedicated_mtg_cards/cosmonaut_zenith.html" ><img src="/public/mtg/thumbnails/cosmonaut_zenith.webp" alt="cosmonaut_zenith" ></a></li>
<li data-search="ecstatic_beauty" title="" ><a href="/dedicated_mtg_cards/ecstatic_beauty.html" ><img src="/public/mtg/thumbnails/ecstatic_beauty.webp" alt="ecstatic_beauty" ></a></li>
<li data-search="glacial_chasm" title="" ><a href="/dedicated_mtg_cards/glacial_chasm.html" ><img src="/public/mtg/thumbnails/glacial_chasm.webp" alt="glacial_chasm" ></a></li>
<li data-search="mind_goblin" title="" ><a href="/dedicated_mtg_cards/mind_goblin.html" ><img src="/public/mtg/thumbnails/mind_goblin.webp" alt="mind_goblin" ></a></li>
<li data-search="mind_goblins_reference_card_2" title="" ><a href="/dedicated_mtg_cards/mind_goblins_reference_card_2.html" ><img src="/public/mtg/thumbnails/mind_goblins_reference_card_2.webp" alt="mind_goblins_reference_card_2" ></a></li>
<li data-search="nadu_winged_wisdom" title="" ><a href="/dedicated_mtg_cards/nadu_winged_wisdom.html" ><img src="/public/mtg/thumbnails/nadu_winged_wisdom.webp" alt="nadu_winged_wisdom" ></a></li>
<li data-search="the_altar" title="" ><a href="/dedicated_mtg_cards/the_altar.html" ><img src="/public/mtg/thumbnails/the_altar.webp" alt="the_altar" ></a></li>
<li data-search="winter_moon" title="" ><a href="/dedicated_mtg_cards/winter_moon.html" ><img src="/public/mtg/thumbnails/winter_moon.webp" alt="winter_moon" ></a></li>
</ul>

</main>

<script>
    const lis = document.querySelectorAll("li:not([data-card-type])");
    lis.forEach((li) => {
        const images = li.querySelectorAll("img");
        const img = images[images.length - 1];

        li.addEventListener("mousemove", (e) => {
            const rect = img.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const xCenter = rect.width / 2;
            const yCenter = rect.height / 2;

            const xRotate = (yCenter - y) / 7;
            const yRotate = (x - xCenter) / 7;

            img.style.transform = `rotateX(${xRotate}deg) rotateY(${yRotate}deg)`;
        });

        li.addEventListener("mouseleave", () => {
            img.style.transform = `rotateX(0) rotateY(0)`;
        });
    })

    const cardsWithBackside = document.querySelectorAll(`[data-card-type="double_faced"]`)

    cardsWithBackside.forEach((card) => {
        const anchor = card.querySelector("a")

            card.addEventListener("mouseover", (e) => {
                anchor.style.transform="rotateY(180deg)"
            })

            card.addEventListener("mouseout", (e) => {
                anchor.style.transform="rotateY(0deg)"
            })
    })
</script>
</body>
</html>
