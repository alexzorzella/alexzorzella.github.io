<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Custom MtG</title>
    <link href="/css/style.css" rel="stylesheet"/>
    <link href="/public/favicon.ico" rel="icon"/>
</head>

<style>
    ul {
        display: grid;
        gap: 1px;
        justify-content: center;
        padding: 1px;
        background: hsl(from papayawhip h s 50);
        width: 100%;
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    }

    li {
        perspective: 1000px;
        box-sizing: border-box;
        transition: transform 0.25s ease;

        & a {
            display: block;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;

            transition: transform 0.6s;
        }

        & img {
            border: 2px solid hsl(from coral h s 75);
            border-radius: 8px;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease-out;
        }

        &:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        .flip__card-front {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            backface-visibility: hidden;
        }

        .flip__card-back {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            backface-visibility: hidden;
            transform: rotateY(180deg);
        }
    }
</style>

<body>
<main style="background-color: papayawhip;">
    <ul>
<li data-search="a_momentary_lapse_in_physicality" ><a href="/public/mtg/elesh_morn/a_momentary_lapse_in_physicality.png" ><img src="/public/mtg/thumbnails/a_momentary_lapse_in_physicality.webp" alt="a_momentary_lapse_in_physicality" >
<li data-search="adventure" ><a href="/public/mtg/elesh_morn/adventure.png" ><img src="/public/mtg/thumbnails/adventure.webp" alt="adventure" >
<li data-search="another_recurring_nightmare" ><a href="/public/mtg/elesh_morn/another_recurring_nightmare.png" ><img src="/public/mtg/thumbnails/another_recurring_nightmare.webp" alt="another_recurring_nightmare" >
<li data-search="date_at_frys_electronics" ><a href="/public/mtg/elesh_morn/date_at_frys_electronics.png" ><img src="/public/mtg/thumbnails/date_at_frys_electronics.webp" alt="date_at_frys_electronics" >
<li data-search="date_at_the_cat_cafe" ><a href="/public/mtg/elesh_morn/date_at_the_cat_cafe.png" ><img src="/public/mtg/thumbnails/date_at_the_cat_cafe.webp" alt="date_at_the_cat_cafe" >
<li data-search="date_in_the_future" ><a href="/public/mtg/elesh_morn/date_in_the_future.png" ><img src="/public/mtg/thumbnails/date_in_the_future.webp" alt="date_in_the_future" >
<li data-search="elesh_morn_sleepyhead_back_well_done_invasion" data-card-type="double_faced" ><a href="/public/mtg/elesh_morn/elesh_morn_sleepyhead.png" ><img src="/public/mtg/thumbnails/elesh_morn_sleepyhead.webp" alt="elesh_morn_sleepyhead_back_well_done_invasion" class="flip__card-front" >
<img src="/public/mtg/thumbnails/elesh_morn_sleepyhead_back_well_done_invasion.webp" alt="elesh_morn_sleepyhead_back_well_done_invasion" class="flip__card-back" >
<li data-search="falling" ><a href="/public/mtg/elesh_morn/falling.png" ><img src="/public/mtg/thumbnails/falling.webp" alt="falling" >
<li data-search="feast_of_a_lifetime" ><a href="/public/mtg/elesh_morn/feast_of_a_lifetime.png" ><img src="/public/mtg/thumbnails/feast_of_a_lifetime.webp" alt="feast_of_a_lifetime" >
<li data-search="flying" ><a href="/public/mtg/elesh_morn/flying.png" ><img src="/public/mtg/thumbnails/flying.webp" alt="flying" >
<li data-search="getting_chased" ><a href="/public/mtg/elesh_morn/getting_chased.png" ><img src="/public/mtg/thumbnails/getting_chased.webp" alt="getting_chased" >
<li data-search="i_wonder_how_it_ends" ><a href="/public/mtg/elesh_morn/i_wonder_how_it_ends.png" ><img src="/public/mtg/thumbnails/i_wonder_how_it_ends.webp" alt="i_wonder_how_it_ends" >
<li data-search="journey_through_the_subconscious" ><a href="/public/mtg/elesh_morn/journey_through_the_subconscious.png" ><img src="/public/mtg/thumbnails/journey_through_the_subconscious.webp" alt="journey_through_the_subconscious" >
<li data-search="recurring_rift" ><a href="/public/mtg/elesh_morn/recurring_rift.png" ><img src="/public/mtg/thumbnails/recurring_rift.webp" alt="recurring_rift" >
<li data-search="running_slowly" ><a href="/public/mtg/elesh_morn/running_slowly.png" ><img src="/public/mtg/thumbnails/running_slowly.webp" alt="running_slowly" >
<li data-search="surreal" ><a href="/public/mtg/elesh_morn/surreal.png" ><img src="/public/mtg/thumbnails/surreal.webp" alt="surreal" >
</ul>

</main>

<script>
    const lis = document.querySelectorAll("li:not([data-card-type])");
    lis.forEach((li) => {
        const images = li.querySelectorAll("img");
        const img = images[images.length - 1];

        li.addEventListener("mousemove", (e) => {
            const rect = img.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const xCenter = rect.width / 2;
            const yCenter = rect.height / 2;

            const xRotate = (yCenter - y) / 7;
            const yRotate = (x - xCenter) / 7;

            img.style.transform = `rotateX(${xRotate}deg) rotateY(${yRotate}deg)`;
        });

        li.addEventListener("mouseleave", () => {
            img.style.transform = `rotateX(0) rotateY(0)`;
        });
    })

    const cardsWithBackside = document.querySelectorAll(`[data-card-type="double_faced"]`)

    cardsWithBackside.forEach((card) => {
        const anchor = card.querySelector("a")

            card.addEventListener("mouseover", (e) => {
                anchor.style.transform="rotateY(180deg)"
            })

            card.addEventListener("mouseout", (e) => {
                anchor.style.transform="rotateY(0deg)"
            })
    })
</script>
</body>
</html>
