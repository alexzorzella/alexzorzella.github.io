<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Custom MtG</title>
    <link href="/css/style.css" rel="stylesheet"/>
    <link href="/public/favicon.ico" rel="icon"/>
</head>

<style>
    ul {
        display: grid;
        gap: 1px;
        justify-content: center;
        padding: 1px;
        background: hsl(from papayawhip h s 50);
        width: 100%;
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    }

    li {
        perspective: 1000px;
        box-sizing: border-box;
        transition: transform 0.25s ease;

        & a {
            display: block;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;

            transition: transform 0.6s;
        }

        & img {
            border: 2px solid hsl(from coral h s 75);
            border-radius: 8px;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease-out;
        }

        &:hover {
            transform: scale(1.1);
            z-index: 10;
        }
    }
</style>

<body>
<main style="background-color: papayawhip;">
    <ul>
<li data-search="christmas_in_july" title="99 Panasonic" ><a href="//dedicated_mtg_cards/christmas_in_july.html" ><img src="/public/mtg/thumbnails/christmas_in_july.webp" alt="christmas_in_july" ></a></li>
<li data-search="copier_machine" title="Where's the paste machine" ><a href="//dedicated_mtg_cards/copier_machine.html" ><img src="/public/mtg/thumbnails/copier_machine.webp" alt="copier_machine" ></a></li>
<li data-search="fax_machine" title="Windows still supporting fax LOL" ><a href="//dedicated_mtg_cards/fax_machine.html" ><img src="/public/mtg/thumbnails/fax_machine.webp" alt="fax_machine" ></a></li>
<li data-search="repurpose_the_surplus" title="" ><a href="//dedicated_mtg_cards/repurpose_the_surplus.html" ><img src="/public/mtg/thumbnails/repurpose_the_surplus.webp" alt="repurpose_the_surplus" ></a></li>
<li data-search="ring_fit_session" title="" ><a href="//dedicated_mtg_cards/ring_fit_session.html" ><img src="/public/mtg/thumbnails/ring_fit_session.webp" alt="ring_fit_session" ></a></li>
</ul>

</main>

<script>
    const lis = document.querySelectorAll("li:not([data-card-type])");
    lis.forEach((li) => {
        const images = li.querySelectorAll("img");
        const img = images[images.length - 1];

        li.addEventListener("mousemove", (e) => {
            const rect = img.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const xCenter = rect.width / 2;
            const yCenter = rect.height / 2;

            const xRotate = (yCenter - y) / 7;
            const yRotate = (x - xCenter) / 7;

            img.style.transform = `rotateX(${xRotate}deg) rotateY(${yRotate}deg)`;
        });

        li.addEventListener("mouseleave", () => {
            img.style.transform = `rotateX(0) rotateY(0)`;
        });
    })

    const cardsWithBackside = document.querySelectorAll(`[data-card-type="double_faced"]`)

    cardsWithBackside.forEach((card) => {
        const anchor = card.querySelector("a")

            card.addEventListener("mouseover", (e) => {
                anchor.style.transform="rotateY(180deg)"
            })

            card.addEventListener("mouseout", (e) => {
                anchor.style.transform="rotateY(0deg)"
            })
    })
</script>
</body>
</html>
