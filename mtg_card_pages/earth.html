<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Custom MtG</title>
    <link href="/css/style.css" rel="stylesheet"/>
    <link href="/public/favicon.ico" rel="icon"/>
</head>

<style>
    ul {
        display: grid;
        gap: 1px;
        justify-content: center;
        padding: 1px;
        background: hsl(from papayawhip h s 50);
        width: 100%;
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    }

    li {
        perspective: 1000px;
        box-sizing: border-box;
        transition: transform 0.25s ease;

        & a {
            display: block;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;

            transition: transform 0.6s;
        }

        & img {
            border: 2px solid hsl(from coral h s 75);
            border-radius: 8px;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease-out;
        }

        &:hover {
            transform: scale(1.1);
            z-index: 10;
        }
    }
</style>

<body>
<main style="background-color: papayawhip;">
    <ul>
<li data-search="alex_airplane_devourer" ><a href="/public/mtg/earth/alex_airplane_devourer.png" ><img src="/public/mtg/thumbnails/alex_airplane_devourer.webp" alt="alex_airplane_devourer" >
<li data-search="almond_and_milk_enjoyers" ><a href="/public/mtg/earth/almond_and_milk_enjoyers.png" ><img src="/public/mtg/thumbnails/almond_and_milk_enjoyers.webp" alt="almond_and_milk_enjoyers" >
<li data-search="amy_rat_rancher" ><a href="/public/mtg/earth/amy_rat_rancher.png" ><img src="/public/mtg/thumbnails/amy_rat_rancher.webp" alt="amy_rat_rancher" >
<li data-search="david_life_of_the_party" ><a href="/public/mtg/earth/david_life_of_the_party.png" ><img src="/public/mtg/thumbnails/david_life_of_the_party.webp" alt="david_life_of_the_party" >
<li data-search="grace_kelly_glamorous_star_back_preproduction" data-card-type="double_faced" ><a href="/public/mtg/earth/grace_kelly_glamorous_star.png" ><img src="/public/mtg/thumbnails/grace_kelly_glamorous_star.webp" alt="grace_kelly_glamorous_star_back_preproduction" class="flip__card-front" >
<img src="/public/mtg/thumbnails/grace_kelly_glamorous_star_back_preproduction.webp" alt="grace_kelly_glamorous_star_back_preproduction" class="flip__card-back" >
<li data-search="mango_multiversal_constant" ><a href="/public/mtg/earth/mango_multiversal_constant.png" ><img src="/public/mtg/thumbnails/mango_multiversal_constant.webp" alt="mango_multiversal_constant" >
<li data-search="park_imperial_counselor" ><a href="/public/mtg/earth/park_imperial_counselor.png" ><img src="/public/mtg/thumbnails/park_imperial_counselor.webp" alt="park_imperial_counselor" >
<li data-search="scott_enlightened_thinker" ><a href="/public/mtg/earth/scott_enlightened_thinker.png" ><img src="/public/mtg/thumbnails/scott_enlightened_thinker.webp" alt="scott_enlightened_thinker" >
<li data-search="scott_the_astromancer" ><a href="/public/mtg/earth/scott_the_astromancer.png" ><img src="/public/mtg/thumbnails/scott_the_astromancer.webp" alt="scott_the_astromancer" >
<li data-search="sigourney_beaver" ><a href="/public/mtg/earth/sigourney_beaver.png" ><img src="/public/mtg/thumbnails/sigourney_beaver.webp" alt="sigourney_beaver" >
<li data-search="stephan_datamaster" ><a href="/public/mtg/earth/stephan_datamaster.png" ><img src="/public/mtg/thumbnails/stephan_datamaster.webp" alt="stephan_datamaster" >
<li data-search="stephan_tableau_acolyte" ><a href="/public/mtg/earth/stephan_tableau_acolyte.png" ><img src="/public/mtg/thumbnails/stephan_tableau_acolyte.webp" alt="stephan_tableau_acolyte" >
<li data-search="valley_of_hearts_delight_back_highway_280" data-card-type="double_faced" ><a href="/public/mtg/earth/valley_of_hearts_delight.png" ><img src="/public/mtg/thumbnails/valley_of_hearts_delight.webp" alt="valley_of_hearts_delight_back_highway_280" class="flip__card-front" >
<img src="/public/mtg/thumbnails/valley_of_hearts_delight_back_highway_280.webp" alt="valley_of_hearts_delight_back_highway_280" class="flip__card-back" >
</ul>

</main>

<script>
    const lis = document.querySelectorAll("li:not([data-card-type])");
    lis.forEach((li) => {
        const images = li.querySelectorAll("img");
        const img = images[images.length - 1];

        li.addEventListener("mousemove", (e) => {
            const rect = img.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const xCenter = rect.width / 2;
            const yCenter = rect.height / 2;

            const xRotate = (yCenter - y) / 7;
            const yRotate = (x - xCenter) / 7;

            img.style.transform = `rotateX(${xRotate}deg) rotateY(${yRotate}deg)`;
        });

        li.addEventListener("mouseleave", () => {
            img.style.transform = `rotateX(0) rotateY(0)`;
        });
    })

    const cardsWithBackside = document.querySelectorAll(`[data-card-type="double_faced"]`)

    cardsWithBackside.forEach((card) => {
        const anchor = card.querySelector("a")

            card.addEventListener("mouseover", (e) => {
                anchor.style.transform="rotateY(180deg)"
            })

            card.addEventListener("mouseout", (e) => {
                anchor.style.transform="rotateY(0deg)"
            })
    })
</script>
</body>
</html>
