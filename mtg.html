<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Custom MtG</title>
    <link href="css/style.css" rel="stylesheet"/>
</head>

<style>
    ul {
        display: grid;
        gap: 1px;
        justify-content: center;
        padding: 1px;
        background: hsl(from papayawhip h s 50);
        width: 100%;
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    }

    li {
        perspective: 1000px;
        transition: transform 0.25s ease;
        box-sizing: border-box;

        & img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            border: 2px solid hsl(from coral h s 75);
        }

        &:hover {
            transform: scale(1.1);
            z-index: 10;
        }
    }
</style>

<body>
<main style="background-color: papayawhip;">
    <ul>
<li><img src="public/mtg/alex_airplane_devourer.png" alt="alex_airplane_devourer.png"></li>
<li><img src="public/mtg/almond_and_milk_enjoyers.png" alt="almond_and_milk_enjoyers.png"></li>
<li><img src="public/mtg/antinous_siiver_gunner.png" alt="antinous_siiver_gunner.png"></li>
<li><img src="public/mtg/campground.png" alt="campground.png"></li>
<li><img src="public/mtg/date_at_fry_s_electronics.png" alt="date_at_fry_s_electronics.png"></li>
<li><img src="public/mtg/elesh_morn_sleepyhead.png" alt="elesh_morn_sleepyhead.png"></li>
<li><img src="public/mtg/emergency_meeting.png" alt="emergency_meeting.png"></li>
<li><img src="public/mtg/falin_faceless_broker_life.png" alt="falin_faceless_broker_life.png"></li>
<li><img src="public/mtg/garfield_banquet_devourer.png" alt="garfield_banquet_devourer.png"></li>
<li><img src="public/mtg/hike_the_beaten_path.png" alt="hike_the_beaten_path.png"></li>
<li><img src="public/mtg/joseph_traveling_merchant.png" alt="joseph_traveling_merchant.png"></li>
<li><img src="public/mtg/nayeon_frontier_forager.png" alt="nayeon_frontier_forager.png"></li>
<li><img src="public/mtg/nayeon_world_traveler.png" alt="nayeon_world_traveler.png"></li>
<li><img src="public/mtg/nevasca_glacial.png" alt="nevasca_glacial.png"></li>
<li><img src="public/mtg/niall_relentless_ranger.png" alt="niall_relentless_ranger.png"></li>
<li><img src="public/mtg/niall_s_jeep.png" alt="niall_s_jeep.png"></li>
<li><img src="public/mtg/park_ranger.png" alt="park_ranger.png"></li>
<li><img src="public/mtg/scott_the_astromancer.png" alt="scott_the_astromancer.png"></li>
<li><img src="public/mtg/scryfall_random.png" alt="scryfall_random.png"></li>
<li><img src="public/mtg/scryfall_s_random_tale.png" alt="scryfall_s_random_tale.png"></li>
<li><img src="public/mtg/take_six.png" alt="take_six.png"></li>
<li><img src="public/mtg/the_contessa.png" alt="the_contessa.png"></li>
<li><img src="public/mtg/the_guide_niall_s_invention.png" alt="the_guide_niall_s_invention.png"></li>
<li><img src="public/mtg/unplanned_hike.png" alt="unplanned_hike.png"></li>
<li><img src="public/mtg/well_done_invasion.png" alt="well_done_invasion.png"></li>
</ul>

</main>

<script>
    const lis = document.querySelectorAll("li");
    lis.forEach((li) => {
        const img = li.querySelector("img");

        li.addEventListener("mousemove", (e) => {
            const rect = li.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const xCenter = rect.width / 2;
            const yCenter = rect.height / 2;

            const xRotate = (yCenter - y) / 7;
            const yRotate = (x - xCenter) / 7;

            img.style.transform = `rotateX(${xRotate}deg) rotateY(${yRotate}deg)`;
        });

        li.addEventListener("mouseleave", () => {
            img.style.transform = `rotateX(0) rotateY(0)`;
        });
    })
</script>

</body>
</html>
