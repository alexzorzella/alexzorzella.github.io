<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>

<style>
    html {
        scrollbar-gutter: stable;
    }

    ul {
        display: grid;
        gap: 1px;
        justify-content: center;
        padding: 1px;
        background: hsl(from papayawhip h s 50);
        width: 100%;
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    }

    li {
        perspective: 1000px;
        box-sizing: border-box;
        transition: transform 0.25s ease;

        & a {
            display: block;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        & img {
            border: 2px solid hsl(from coral h s 75);
            border-radius: 8px;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease-out;
        }

        &:hover {
            transform: scale(1.1);
            z-index: 10;
        }
    }
</style>
<div
        id="flip"
        style="
        width: 300px;
        aspect-ratio: 3 / 4;
        /*width: 100%;*/
        /*height: 100%;*/
        perspective: 1000px;
    "
>
    <div
            id="card"
            style="
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            border: 1px solid coral;
        "
    >
        <!-- Front -->
        <img
                src="/public/mtg/thumbnails/date_at_henry_cowell_national_park.webp"
                alt="date_at_henry_cowell_national_park"
                style="
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 12px;
                backface-visibility: hidden;
            "
        >

        <!-- Back -->
        <img
                src="/public/mtg/thumbnails/date_at_henry_cowell_national_park_back_henry_cowell_national_park.webp"
                alt="date_at_henry_cowell_national_park_back_henry_cowell_national_park"
                style="
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 12px;
                backface-visibility: hidden;
                transform: rotateY(180deg);">
    </div>
</div>

<script>
        const flip = document.getElementById("flip")
        const card = document.getElementById("card")
        flip.addEventListener("mouseover", (e) => {
            console.log("flip enter")
            card.style.transform="rotateY(180deg)"
            console.log("flip enter", card.style)

        })
        flip.addEventListener("mouseout", (e) => {
            console.log("flip exit")
            card.style.transform="rotateY(0deg)"
            console.log("flip exit", card.style)
        })
</script>

</body>
</html>
