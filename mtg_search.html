<style>
    html {
        scrollbar-gutter: stable;
    }

    ul {
        display: grid;
        gap: 1px;
        justify-content: center;
        padding: 1px;
        background: hsl(from papayawhip h s 50);
        width: 100%;
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    }

    li {
        perspective: 1000px;
        box-sizing: border-box;
        transition: transform 0.25s ease;

        & a {
            display: block;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;

            transition: transform 0.6s;
        }

        & img {
            border: 2px solid hsl(from coral h s 75);
            border-radius: 8px;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease-out;
        }

        &:hover {
            transform: scale(1.1);
            z-index: 10;
        }
    }
</style>

<script>
    const search = document.getElementById("search")

    function setQueryParameters(key, value) {
        const url = new URL(window.location.href);
        url.searchParams.set(key, value);
        window.history.replaceState({}, '', url);
    }

    const all_lis = document.querySelectorAll("li");

    function updateVisibleCards(search_text) {
        const queries = search_text.trim().toLowerCase().split(" ")

        for(const li of all_lis) {
            const cardName = li.dataset["search"]

            const passes = queries.some((q) => cardName.includes(q.toLowerCase()))

            if(!passes) {
                li.style["display"] = "none";
            } else {
                li.style["display"] = "block";
            }
        }
    }

    const url = new URL(window.location.href)
    const initial_query = url.searchParams.get("q")
    if (initial_query !== null) {
        updateVisibleCards(initial_query)
        search.value = initial_query
    }

    search.addEventListener("input", (e) => {
        setQueryParameters("q", e.target.value)
        updateVisibleCards(e.target.value)
    })

    const perspective_compatible_lis = document.querySelectorAll("li:not([data-card-type])");
    perspective_compatible_lis.forEach((li) => {
        const images = li.querySelectorAll("img");
        const img = images[images.length - 1];

        li.addEventListener("mousemove", (e) => {
            const rect = img.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const xCenter = rect.width / 2;
            const yCenter = rect.height / 2;

            const xRotate = (yCenter - y) / 7;
            const yRotate = (x - xCenter) / 7;

            img.style.transform = `rotateX(${xRotate}deg) rotateY(${yRotate}deg)`;
        });

        li.addEventListener("mouseleave", () => {
            img.style.transform = `rotateX(0) rotateY(0)`;
        });

        const cardsWithBackside = document.querySelectorAll(`[data-card-type="double_faced"]`)

        cardsWithBackside.forEach((card) => {
            const anchor = card.querySelector("a")

                card.addEventListener("mouseover", (e) => {
                    anchor.style.transform="rotateY(180deg)"
                })

                card.addEventListener("mouseout", (e) => {
                    anchor.style.transform="rotateY(0deg)"
                })
        })
    })
</script>
